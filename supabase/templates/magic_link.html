<!-- Rendered by GoTrue. Available vars: {{ .ConfirmationURL }}, {{ .Token }},
     {{ .TokenHash }}, {{ .SiteURL }}, {{ .Email }}. -->
<div style="font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #18181b;">
  <h1 style="font-size: 20px; margin: 0 0 16px;">Sign in to Supademo</h1>
  <p style="font-size: 15px; line-height: 1.6; margin: 0 0 24px; color: #3f3f46;">
    Use the link below to sign in. It expires in one hour and can only be used
    once.
  </p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .ConfirmationURL }}"
       style="display: inline-block; background: #18181b; color: #ffffff; text-decoration: none; padding: 10px 18px; border-radius: 8px; font-size: 15px;">
      Sign in
    </a>
  </p>
  <p style="font-size: 15px; color: #3f3f46; margin: 0 0 24px;">
    Or enter this code: <strong style="letter-spacing: 2px;">{{ .Token }}</strong>
  </p>
  <p style="font-size: 13px; color: #a1a1aa; margin: 0;">
    If you didn't request this, ignore this email — nobody can sign in without
    the link.
  </p>
</div>
