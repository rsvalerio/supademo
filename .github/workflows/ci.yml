name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Migrations, lint and pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No setup-cli action: ./supa fetches the pinned, checksum-verified CLI
      # itself. CI therefore runs the identical resolution path as a laptop, so
      # "works on my machine" and "works in CI" cannot diverge over tooling.
      - name: Cache the pinned toolchain
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('scripts/toolchain.lock') }}

      # Boots Postgres, GoTrue, Storage, Realtime and the edge runtime, applies
      # every migration in order, then the seed files. A migration that only
      # works against an already-migrated database fails right here.
      - name: Start the local stack
        run: ./supa start

      # .tool-versions is generated from scripts/toolchain.lock; a hand-edit or a
      # lock bump must not leave mise/asdf users on a different version.
      - name: Pinned toolchain is consistent
        run: bash scripts/tool-versions.sh --check

      - name: Verify migrations apply to a clean database
        run: ./supa db reset

      - name: Lint the schema
        run: ./supa db lint --local --level warning --fail-on warning

      # The same checks the dashboard's Security and Performance Advisors run:
      # tables without RLS, SECURITY DEFINER views, functions with a mutable
      # search_path, unindexed foreign keys. Security failures block; the
      # performance ones are reported and left to judgement.
      - name: Security advisors
        run: ./supa db advisors --local --type security --level warn --fail-on error

      - name: Performance advisors
        run: ./supa db advisors --local --type performance --level warn --fail-on none

      - name: Run pgTAP tests
        run: ./supa test db --local

      # A committed types file that no longer matches the schema is worse than
      # no types file: it type-checks against a database that does not exist.
      - name: Check generated types are current
        run: |
          ./supa gen types --local --schema public,api \
            > packages/db-types/src/database.types.ts
          if ! git diff --quiet -- packages/db-types/src/database.types.ts; then
            echo "::error::packages/db-types is stale. Run 'npm run gen:types' and commit."
            git diff --stat -- packages/db-types/src/database.types.ts
            exit 1
          fi

      - name: Stop the stack
        if: always()
        run: ./supa stop

  functions:
    name: Edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # These use a local deno when there is one and the official image
      # otherwise, so no setup action is needed here either.
      - name: Format
        run: bash scripts/functions.sh fmt --check

      - name: Lint and type check
        run: bash scripts/functions.sh check

  javascript:
    name: Workspace typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No setup-bun action: scripts/js.sh fetches the pinned, checksum-verified
      # Bun itself, so CI runs the identical resolution path as a laptop.
      - name: Cache the pinned toolchain
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('scripts/toolchain.lock') }}

      - name: Install workspace dependencies
        run: bash scripts/js.sh install --frozen-lockfile

      - name: Typecheck packages
        run: bash scripts/js.sh typecheck

  security:
    name: Policy invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cheap, fast, and catches the mistake that matters most: a new table with
      # no RLS. The pgTAP suite asserts the same thing against the live schema;
      # this is the grep-level backstop for a migration that never got applied.
      - name: Every new table enables RLS
        run: |
          missing=0
          for file in supabase/migrations/*.sql; do
            while read -r table; do
              if ! grep -qi "alter table $table enable row level security" supabase/migrations/*.sql; then
                echo "::error file=$file::public.$table never enables row level security"
                missing=1
              fi
            done < <(grep -oiP '(?<=create table )public\.\w+' "$file" || true)
          done
          exit $missing

      - name: No service role key in tracked files
        run: |
          if grep -rInE 'service_role.*ey[JI]|SUPABASE_SERVICE_ROLE_KEY *= *ey' \
               --exclude-dir=.git --exclude='*.example' . ; then
            echo "::error::A service role key looks committed."
            exit 1
          fi
